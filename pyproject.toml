[project]
name = "i-vit"
version = "0.1.0"
description = "I-ViT: Integer-only Quantization for Efficient Vision Transformer Inference"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Deep Learning (core)
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    "timm==0.4.12",
    
    # Scientific Computing
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    
    # Visualization & Logging
    "tensorboard>=2.18.0",
    "tqdm>=4.67.1",
    
    # Image Processing
    "pillow>=10.0.0",
    
    # Utilities
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "kaggle>=1.7.4",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }


